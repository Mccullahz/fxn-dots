# ─── Keybinds ────────────────────────────────────────────────
# https://wiki.hyprland.org/Configuring/Binds/
#
# Anything that used to shell out to rofi / wlogout / swaync now
# talks to Quickshell over IPC. `qs -c fxn ipc call <target> <fn>`
# is cheap — it is a unix-socket round trip, no process spawn.

$mainMod = SUPER
$bin     = $HOME/.config/hypr/bin
$qs      = qs -c fxn ipc call

# ─── Launching ──────────────────────────────────────────────
bind = $mainMod, Return,       exec, $term
bind = $mainMod SHIFT, Return, exec, [float; move 15% 5%; size 70% 60%] $term
bind = $mainMod, E,            exec, $files
bind = $mainMod, B,            exec, $browser

# ─── Quickshell surfaces ────────────────────────────────────
bind = $mainMod, D,            exec, $qs launcher toggle          # app launcher
bind = $mainMod, S,            exec, $qs launcher openWeb         # web search
bind = $mainMod ALT, C,        exec, $qs launcher openCalc        # calculator
bind = $mainMod ALT, E,        exec, $qs launcher openEmoji       # emoji picker
bind = $mainMod ALT, V,        exec, $qs launcher openClipboard   # clipboard history
bind = $mainMod, A,            exec, $qs overview toggle          # workspace overview
bind = $mainMod, W,            exec, $qs wallpaper toggle         # wallpaper picker
bind = $mainMod, H,            exec, $qs cheatsheet toggle        # this keybind list
bind = $mainMod SHIFT, N,      exec, $qs controlcenter toggle     # notifications + toggles
bind = $mainMod SHIFT, D,      exec, $qs notifications toggleDnd  # do-not-disturb
bind = CTRL ALT, P,            exec, $qs powermenu toggle         # power menu
bind = $mainMod, grave,        exec, $qs edge toggle              # open the edge island
bind = $mainMod CTRL ALT, B,   exec, $qs bar toggle               # hide/show the bar

bind = $mainMod, Escape,       exec, $qs shell dismiss            # close whatever is open
bind = CTRL ALT, L,            exec, loginctl lock-session        # hyprlock via hypridle
bind = CTRL ALT, Delete,       exec, hyprctl dispatch exit 0

# ─── Window management ──────────────────────────────────────
bind = $mainMod, Q,            killactive
bind = $mainMod SHIFT, Q,      exec, $bin/kill-active.sh
bind = $mainMod, SPACE,        togglefloating
bind = $mainMod ALT, SPACE,    exec, hyprctl dispatch workspaceopt allfloat
bind = $mainMod SHIFT, F,      fullscreen, 0
bind = $mainMod CTRL, F,       fullscreen, 1
bind = $mainMod, P,            pseudo
bind = $mainMod, G,            togglegroup
bind = $mainMod CTRL, tab,     changegroupactive
bind = $mainMod CTRL, O,       exec, hyprctl setprop active opaque toggle

bind = ALT, tab,               cyclenext
bind = ALT, tab,               bringactivetotop

# Master layout
bind = $mainMod CTRL, D,       layoutmsg, removemaster
bind = $mainMod, I,            layoutmsg, addmaster
bind = $mainMod, J,            layoutmsg, cyclenext
bind = $mainMod, K,            layoutmsg, cycleprev
bind = $mainMod CTRL, Return,  layoutmsg, swapwithmaster
bind = $mainMod, M,            layoutmsg, togglesplit

# Focus
bind = $mainMod, left,         movefocus, l
bind = $mainMod, right,        movefocus, r
bind = $mainMod, up,           movefocus, u
bind = $mainMod, down,         movefocus, d

# Move
bind = $mainMod CTRL, left,    movewindow, l
bind = $mainMod CTRL, right,   movewindow, r
bind = $mainMod CTRL, up,      movewindow, u
bind = $mainMod CTRL, down,    movewindow, d

# Swap
bind = $mainMod ALT, left,     swapwindow, l
bind = $mainMod ALT, right,    swapwindow, r
bind = $mainMod ALT, up,       swapwindow, u
bind = $mainMod ALT, down,     swapwindow, d

# Resize
binde = $mainMod SHIFT, left,  resizeactive, -50 0
binde = $mainMod SHIFT, right, resizeactive,  50 0
binde = $mainMod SHIFT, up,    resizeactive,  0 -50
binde = $mainMod SHIFT, down,  resizeactive,  0 50

bindm = $mainMod, mouse:272,   movewindow
bindm = $mainMod, mouse:273,   resizewindow

# ─── Workspaces ─────────────────────────────────────────────
# code:10 = "1", code:11 = "2" ... code:19 = "0".
# Using keycodes keeps these working on non-US layouts.
bind = $mainMod, code:10, workspace, 1
bind = $mainMod, code:11, workspace, 2
bind = $mainMod, code:12, workspace, 3
bind = $mainMod, code:13, workspace, 4
bind = $mainMod, code:14, workspace, 5
bind = $mainMod, code:15, workspace, 6
bind = $mainMod, code:16, workspace, 7
bind = $mainMod, code:17, workspace, 8
bind = $mainMod, code:18, workspace, 9
bind = $mainMod, code:19, workspace, 10

bind = $mainMod SHIFT, code:10, movetoworkspace, 1
bind = $mainMod SHIFT, code:11, movetoworkspace, 2
bind = $mainMod SHIFT, code:12, movetoworkspace, 3
bind = $mainMod SHIFT, code:13, movetoworkspace, 4
bind = $mainMod SHIFT, code:14, movetoworkspace, 5
bind = $mainMod SHIFT, code:15, movetoworkspace, 6
bind = $mainMod SHIFT, code:16, movetoworkspace, 7
bind = $mainMod SHIFT, code:17, movetoworkspace, 8
bind = $mainMod SHIFT, code:18, movetoworkspace, 9
bind = $mainMod SHIFT, code:19, movetoworkspace, 10

bind = $mainMod CTRL, code:10, movetoworkspacesilent, 1
bind = $mainMod CTRL, code:11, movetoworkspacesilent, 2
bind = $mainMod CTRL, code:12, movetoworkspacesilent, 3
bind = $mainMod CTRL, code:13, movetoworkspacesilent, 4
bind = $mainMod CTRL, code:14, movetoworkspacesilent, 5
bind = $mainMod CTRL, code:15, movetoworkspacesilent, 6
bind = $mainMod CTRL, code:16, movetoworkspacesilent, 7
bind = $mainMod CTRL, code:17, movetoworkspacesilent, 8
bind = $mainMod CTRL, code:18, movetoworkspacesilent, 9
bind = $mainMod CTRL, code:19, movetoworkspacesilent, 10

bind = $mainMod, tab,           workspace, m+1
bind = $mainMod SHIFT, tab,     workspace, m-1
bind = $mainMod, period,        workspace, e+1
bind = $mainMod, comma,         workspace, e-1
bind = $mainMod, mouse_down,    workspace, e+1
bind = $mainMod, mouse_up,      workspace, e-1

bind = $mainMod SHIFT, bracketleft,  movetoworkspace, -1
bind = $mainMod SHIFT, bracketright, movetoworkspace, +1
bind = $mainMod CTRL, bracketleft,   movetoworkspacesilent, -1
bind = $mainMod CTRL, bracketright,  movetoworkspacesilent, +1

# Scratchpad
bind = $mainMod, U,        togglespecialworkspace, scratch
bind = $mainMod SHIFT, U,  movetoworkspace, special:scratch

# ─── Media & hardware keys ──────────────────────────────────
# Routed through Quickshell so the OSD follows every change.
bindel = , XF86AudioRaiseVolume,  exec, $qs audio volumeUp
bindel = , XF86AudioLowerVolume,  exec, $qs audio volumeDown
bindl  = , XF86AudioMute,         exec, $qs audio toggleMute
bindl  = , XF86AudioMicMute,      exec, $qs audio toggleMicMute
bindel = , XF86MonBrightnessUp,   exec, $qs brightness up
bindel = , XF86MonBrightnessDown, exec, $qs brightness down
bindel = , XF86KbdBrightnessUp,   exec, $qs brightness kbdUp
bindel = , XF86KbdBrightnessDown, exec, $qs brightness kbdDown

bindl = , XF86AudioPlay,      exec, $qs mpris playPause
bindl = , XF86AudioPause,     exec, $qs mpris playPause
bindl = , XF86AudioPlayPause, exec, $qs mpris playPause
bindl = , XF86AudioNext,      exec, $qs mpris next
bindl = , XF86AudioPrev,      exec, $qs mpris previous
bindl = , XF86AudioStop,      exec, $qs mpris stop

bindl = , XF86Sleep,  exec, systemctl suspend
bindl = , XF86Rfkill, exec, $bin/airplane-mode.sh

# ─── Screenshots ────────────────────────────────────────────
bind = $mainMod, Print,             exec, $bin/screenshot.sh screen
bind = $mainMod SHIFT, Print,       exec, $bin/screenshot.sh area
bind = ALT, Print,                  exec, $bin/screenshot.sh window
bind = $mainMod CTRL, Print,        exec, $bin/screenshot.sh delay 5
bind = $mainMod CTRL SHIFT, Print,  exec, $bin/screenshot.sh delay 10
bind = $mainMod SHIFT, S,           exec, $bin/screenshot.sh edit

# Same set on F6 for keyboards with no PrtSc
bind = $mainMod, F6,        exec, $bin/screenshot.sh screen
bind = $mainMod SHIFT, F6,  exec, $bin/screenshot.sh area
bind = ALT, F6,             exec, $bin/screenshot.sh window

# ─── Desktop zoom ───────────────────────────────────────────
binde = $mainMod ALT, mouse_down, exec, $bin/zoom.sh in
binde = $mainMod ALT, mouse_up,   exec, $bin/zoom.sh out
bind  = $mainMod ALT, 0,          exec, $bin/zoom.sh reset
