# ─── Appearance ──────────────────────────────────────────────
# Colours ($color0..$color15, $background, $foreground) come from
# wallust. Regenerated on every wallpaper change.
source = $HOME/.config/hypr/theme/colors.conf
source = $HOME/.config/hypr/theme/roles.conf    # $accent, $border … from fxn-theme

# ─── Window transparency ────────────────────────────────────
# Used by the opacity rules in 40-rules.conf. Absolute values, not
# multipliers: 0.85 means 85% opaque whatever decoration{} says.
# Kitty also has its own background_opacity in kitty.conf, which
# stacks on top of these.
$opacity                = 0.95   # terminals, browsers, editors… focused
$opacity_inactive       = 0.80   # …and unfocused
$opacity_media          = 0.94   # chat, video, image viewers
$opacity_media_inactive = 0.86

general {
  border_size      = 2
  gaps_in          = 2    # between tiled windows
  gaps_out         = 4    # between windows and the screen edge
  resize_on_border = true
  layout           = dwindle

  col.active_border   = $border
  col.inactive_border = $border_inactive
}

decoration {
  rounding = 10

  active_opacity     = 1.0
  inactive_opacity   = 0.9
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.1
  dim_special  = 0.8

  shadow {
    enabled        = true
    range          = 3
    render_power   = 1
    color          = $border
    color_inactive = $border_inactive
  }

  # Tuned for Intel HD 5500. Each pass is a full-region Gaussian;
  # 2 → 1 roughly halves the cost and the difference is hard to see
  # at size 4. Raise both on a machine with a discrete GPU.
  blur {
    enabled           = true
    size              = 4
    passes            = 1
    ignore_opacity    = true
    new_optimizations = true
    special           = false
    popups            = true
  }
}

group {
  col.border_active = $accent_alt

  groupbar {
    col.active = $surface
  }
}

dwindle {
  preserve_split       = true
  special_scale_factor = 0.8
}

master {
  new_status = master
  new_on_top = true
  mfact      = 0.5
}

animations {
  enabled = true

  bezier = wind,      0.05, 0.9,  0.1,  1.05
  bezier = winIn,     0.1,  1.1,  0.1,  1.1
  bezier = winOut,    0.3, -0.3,  0.0,  1.0
  bezier = liner,     1.0,  1.0,  1.0,  1.0
  bezier = overshot,  0.05, 0.9,  0.1,  1.05
  bezier = smoothOut, 0.5,  0.0,  0.99, 0.99
  bezier = smoothIn,  0.5, -0.5,  0.68, 1.5

  animation = windows,       1, 6, wind, slide
  animation = windowsIn,     1, 5, winIn, slide
  animation = windowsOut,    1, 3, smoothOut, slide
  animation = windowsMove,   1, 5, wind, slide
  animation = border,        1, 1, liner
  animation = fade,          1, 3, smoothOut
  animation = workspaces,    1, 5, overshot
  animation = workspacesIn,  1, 5, winIn, slide
  animation = workspacesOut, 1, 5, winOut, slide

  # Quickshell surfaces. `layers` covers every wlr-layer-shell
  # surface; the per-namespace rules below refine it.
  animation = layers,     1, 3, smoothOut, slide
  animation = layersIn,   1, 3, winIn, slide
  animation = layersOut,  1, 3, smoothOut, slide
}
