# ─── Monitors ────────────────────────────────────────────────
# monitor = NAME, RESOLUTION@HZ, POSITION, SCALE
#
# Ported from the nwg-displays output. `monitor = ,preferred,auto,1`
# is the catch-all so unknown outputs (and the QA sandbox's nested
# window) still light up.

# The internal panel is 1366x768. The old nwg-displays export claimed
# 1920x1080, which Hyprland silently ignored in favour of the preferred
# mode — so it worked, but the file was wrong. `preferred` says what is
# actually meant and survives a panel swap.
monitor = eDP-1, preferred, 4693x2381, 1.0

# External outputs, carried over from the old config and not verified
# against real hardware. Run `hyprctl monitors` with them plugged in and
# correct these, or leave them on `preferred`.
monitor = DP-3,  preferred, 5755x1186, 1.0
monitor = DP-4,  preferred, 3667x1186, 1.0

monitor = , preferred, auto, 1

# ─── Workspace → monitor assignment ─────────────────────────
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/
# Left blank by default so workspaces follow focus. Uncomment and
# adapt if you want workspaces pinned to particular outputs.

# workspace = 1, monitor:DP-4, default:true
# workspace = 2, monitor:DP-3, default:true
# workspace = 3, monitor:eDP-1, default:true

workspace = special:scratch, on-created-empty:$term
