# ─── Laptop-specific ─────────────────────────────────────────
# ASUS ROG. Harmless on a desktop — the binds just never fire and
# the device rule no-ops if the touchpad isn't present.

$touchpad = asue1209:00-04f3:319f-touchpad

device {
  name    = $touchpad
  enabled = true
}

# ASUS hardware keys
bind = , XF86Launch1, exec, rog-control-center     # Armoury Crate key
bind = , XF86Launch3, exec, asusctl led-mode -n    # Fn+F4  keyboard RGB profile
bind = , XF86Launch4, exec, asusctl profile -n     # Fn+F5  fan profile
bind = , XF86TouchpadToggle, exec, $HOME/.config/hypr/bin/touchpad.sh

# ─── Lid switch ─────────────────────────────────────────────
# Disable the internal panel on close, restore on open. Guarded so
# closing the lid with no external display attached suspends instead
# of leaving you with zero outputs.
bindl = , switch:on:Lid Switch,  exec, $HOME/.config/hypr/bin/lid.sh close
bindl = , switch:off:Lid Switch, exec, $HOME/.config/hypr/bin/lid.sh open
