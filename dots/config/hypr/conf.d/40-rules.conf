# ─── Workspace placement ────────────────────────────────────
windowrule {
  name = r039
  workspace = 1
  match:tag = email*
}
windowrule {
  name = r040
  workspace = 2
  match:tag = browser*
}
windowrule {
  name = r041
  workspace = 4 silent
  match:tag = screenshare*
}
windowrule {
  name = r042
  workspace = 5
  match:tag = gamestore*
}
windowrule {
  name = r043
  workspace = 6 silent
  match:class = ^\.?(virt-manager)(-wrapped)?$
}
windowrule {
  name = r044
  workspace = 7
  match:tag = im*
}
windowrule {
  name = r045
  workspace = 8
  match:tag = games*
}
windowrule {
  name = r046
  workspace = 9 silent
  match:tag = multimedia*
}

# ─── Opacity ────────────────────────────────────────────────
# Values live in 30-look.conf ($opacity, $opacity_inactive, …).
windowrule {
  name = r047
  opacity = $opacity override $opacity_inactive override
  match:tag = terminal*
}
windowrule {
  name = r048
  opacity = $opacity override $opacity_inactive override
  match:tag = browser*
}
windowrule {
  name = r049
  opacity = $opacity override $opacity_inactive override
  match:tag = projects*
}
windowrule {
  name = r050
  opacity = $opacity override $opacity_inactive override
  match:tag = filemanager*
}
windowrule {
  name = r051
  opacity = $opacity_media override $opacity_media_inactive override
  match:tag = im*
}
windowrule {
  name = r052
  opacity = $opacity_media override $opacity_media_inactive override
  match:tag = multimedia*
}
windowrule {
  name = r053
  opacity = $opacity override $opacity_inactive override
  match:tag = settings*
}
windowrule {
  name = r054
  opacity = $opacity_media override $opacity_media_inactive override
  match:tag = viewer*
}
windowrule {
  name = r055
  opacity = $opacity override $opacity_inactive override
  match:class = ^(gedit|org.gnome.TextEditor|mousepad)$
}
windowrule {
  name = r056
  opacity = $opacity override $opacity_inactive override
  match:class = ^(im.riot.Riot|deluge|seahorse)$
}

# ─── Floating ───────────────────────────────────────────────
windowrule {
  name = r057
  float = on
  size = (monitor_w*0.7) (monitor_h*0.7)
  center = on
  match:tag = settings*
}
windowrule {
  name = r058
  float = on
  center = on
  match:tag = viewer*
}
windowrule {
  name = r059
  float = on
  center = on
  match:tag = multimedia*
}
windowrule {
  name = r060
  float = on
  center = on
  size = (monitor_w*0.6) (monitor_h*0.7)
  match:tag = im*
}
windowrule {
  name = r061
  float = on
  center = on
  match:class = ^([Zz]oom|onedriver|onedriver-launcher)$
}
windowrule {
  name = r062
  float = on
  center = on
  match:class = ^(org.gnome.Calculator|[Qq]alculate-gtk)$
}
windowrule {
  name = r063
  float = on
  center = on
  match:title = ^(Authentication Required)$
}

# Dialogs that open detached from their parent
windowrule {
  name = r064
  float = on
  match:class = ^(codium|codium-url-handler|VSCodium)$
  match:title = negative:(.*codium.*|.*VSCodium.*)
}
windowrule {
  name = r065
  float = on
  match:class = ^([Ss]team)$
  match:title = negative:^([Ss]team)$
}
windowrule {
  name = r066
  float = on
  match:class = ^(com.heroicgameslauncher.hgl)$
  match:title = negative:^(Heroic Games Launcher)$
}
windowrule {
  name = r067
  float = on
  center = on
  match:class = ^([Tt]hunar)$
  match:title = negative:(.*[Tt]hunar.*)
}
windowrule {
  name = r068
  float = on
  center = on
  size = (monitor_w*0.7) (monitor_h*0.6)
  match:initial_title = ^(Open Files|Add Folder to Workspace)$
}

# ─── Misc behaviour ─────────────────────────────────────────
windowrule {
  name = r069
  no_blur = on
  fullscreen = on
  match:tag = games*
}
windowrule {
  name = r070
  idle_inhibit = fullscreen
  match:fullscreen = 1
}
windowrule {
  name = r071
  float = on
  pin = on
  keep_aspect_ratio = on
  opacity = 0.95 0.75
  move = (monitor_w*0.72) (monitor_h*0.07)
  match:title = ^(Picture-in-Picture)$
}

# The XWayland screenshare bridge must stay invisible
windowrule {
  name = r072
  no_anim = on
  opacity = 0.0 override
  no_initial_focus = on
  match:class = ^(xwaylandvideobridge)$
}

# ─── Layer rules: Quickshell surfaces ───────────────────────
# Namespaces are set in each module's WlrLayershell.namespace —
# keep the two lists in step. Like windowrule, layerrule needs the
# block form on Hyprland 0.51+.
#
# Only the edge is blurred. On a Broadwell iGPU each blurred layer
# costs a framebuffer readback plus a Gaussian pass every frame it
# is visible, and the edge is the one surface that is always up.
# The transient surfaces stay sharp and are cheap because of it.

layerrule {
  name = layer-edge
  blur = on
  ignore_alpha = 0.4
  match:namespace = ^(fxn-edge)$
}


# The bar, when shellStyle is "bar" instead of "edge".
layerrule {
  name = layer-bar
  blur = on
  ignore_alpha = 0.3
  match:namespace = ^(fxn-bar)$
}

# The control center animates itself, on the edge's timing. Hyprland's
# layer slide would move the whole full-screen surface on top of that.
layerrule {
  name = layer-controlcenter
  no_anim = on
  match:namespace = ^(fxn-controlcenter)$
}

