# ─── Window & layer rules ────────────────────────────────────
# https://wiki.hyprland.org/Configuring/Window-Rules/
#
# Hyprland 0.51+ uses the block form below; the old one-line
# `windowrule = float, class:^(x)$` syntax no longer parses.
#
# Apps are sorted into tags first, then rules are applied per tag. Add
# an app to an existing tag and it inherits every rule for that tag.
# Every rule needs a unique `name`.

# ─── Tags ───────────────────────────────────────────────────
windowrule {
  name = r001
  tag = +browser
  match:class = ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$
}
windowrule {
  name = r002
  tag = +browser
  match:class = ^([Gg]oogle-chrome(-beta|-dev|-unstable)?)$
}
windowrule {
  name = r003
  tag = +browser
  match:class = ^(chrome-.+-Default)$
}
windowrule {
  name = r004
