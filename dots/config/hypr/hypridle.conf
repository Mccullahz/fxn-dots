# ─── hypridle ────────────────────────────────────────────────
# Timeline:  9:00 idle warning → 10:00 lock → 10:30 screen off
#            → 20:00 suspend (on battery only)

general {
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Idle warning
listener {
    timeout    = 540
    on-timeout = notify-send -a hypridle -i preferences-desktop-screensaver "Going idle" "Locking in one minute."
    on-resume  = notify-send -a hypridle -i preferences-desktop-screensaver "Welcome back"
}

# Lock
listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}

# Screen off — only once locked, so an unlocked desktop never goes dark
listener {
    timeout    = 630
    on-timeout = pidof hyprlock && hyprctl dispatch dpms off
    on-resume  = pidof hyprlock && hyprctl dispatch dpms on
}

# Suspend on battery. `on_ac_power` exits non-zero when unplugged.
listener {
    timeout    = 1200
    on-timeout = on_ac_power || systemctl suspend
}
