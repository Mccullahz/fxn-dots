# ─────────────────────────────────────────────────────────────
#  Hyprland — entry point
#
#  Everything lives in conf.d/ and is sourced in numeric order.
#  Drop your own overrides in conf.d/99-local.conf; it is the
#  last file read and is never overwritten by promote.sh.
#
#  Paths are all $HOME-relative on purpose: the QA sandbox runs
#  with a fake $HOME, so the exact same config works unmodified
#  in both the playground and the real session.
# ─────────────────────────────────────────────────────────────

$cfg = $HOME/.config/hypr

source = $cfg/conf.d/00-env.conf
source = $cfg/conf.d/10-monitors.conf
source = $cfg/conf.d/20-input.conf
source = $cfg/conf.d/30-look.conf
source = $cfg/conf.d/40-rules.conf
source = $cfg/conf.d/50-binds.conf
source = $cfg/conf.d/60-laptop.conf
source = $cfg/conf.d/70-autostart.conf
source = $cfg/conf.d/99-local.conf
