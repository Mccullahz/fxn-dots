# ─── hyprlock ────────────────────────────────────────────────
#
# Colours come from the same named roles the shell uses (roles.conf,
# written by fxn-theme), so the lock screen always matches the desktop.
#
# The layout is anchored to the centre of the screen, with the input
# sized in percent, so it holds together on the 1366×768 panel and on a
# 1080p external alike. It used to hang off the top edge at pixel
# offsets tuned for a 1080-tall screen, which on 768 put the password
# box on top of the date.
#
# Positions: y is measured from the centre, positive is up.

source = $HOME/.config/hypr/theme/colors.conf
source = $HOME/.config/hypr/theme/roles.conf

$font = JetBrainsMono Nerd Font

general {
    hide_cursor        = true
    immediate_render   = true
    fractional_scaling = 2
}

animations {
    enabled   = true
    bezier    = settle, 0.2, 0.9, 0.3, 1
    animation = fadeIn,         1, 3, settle
    animation = fadeOut,        1, 3, settle
    animation = inputFieldDots, 1, 2, settle
}

background {
    monitor =
    path    = $HOME/.cache/fxn/wallpaper/current
    color   = $bg

    # Dimmed so the text holds its contrast whatever the wallpaper is.
    blur_passes = 2
    blur_size   = 4
    brightness  = 0.62
    contrast    = 1.0
    vibrancy    = 0.12
    noise       = 0.01
}

# ─── Time and date ──────────────────────────────────────────

label {
    monitor     =
    text        = cmd[update:1000] date +"%-I:%M"
    color       = $fg
    font_size   = 92
    font_family = $font ExtraBold
    position    = 0, 150
    halign      = center
    valign      = center
}

label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %-d %B"
    color       = $muted
    font_size   = 15
    font_family = $font
    position    = 0, 68
    halign      = center
    valign      = center
}

# ─── Password ───────────────────────────────────────────────

input-field {
    monitor =
    size    = 22%, 6%

    outline_thickness = 2
    rounding          = -1

    outer_color    = $accent
    inner_color    = $surface_glass
    font_color     = $fg
    check_color    = $accent_alt
    fail_color     = $error
    capslock_color = $warning

    font_family = $font

    # The colour inside markup must be a bare hex. $muted is rgb(…), which
    # Pango rejects — and when markup fails to parse, hyprlock shows the raw
    # <span …> text instead, which is what used to appear in the box.
    placeholder_text = <span foreground="##$muted_hex"><i>password</i></span>
    fail_text        = <span foreground="##$error_hex">$PAMFAIL</span>

    dots_size     = 0.22
    dots_spacing  = 0.35
    dots_center   = true
    fade_on_empty = false

    position = 0, -24
    halign   = center
    valign   = center
}

# ─── Status ─────────────────────────────────────────────────

label {
    monitor     =
    text        = cmd[update:30000] $HOME/.config/hypr/bin/lock-status.sh
    color       = $muted
    font_size   = 12
    font_family = $font
    position    = 0, 28
    halign      = center
    valign      = bottom
}
